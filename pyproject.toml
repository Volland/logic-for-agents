[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logic-for-agents"
version = "0.1.0"
description = "The logic layer of a little neurosymbolic agent: companion code for Part III of Logic for Agents"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["leanelpi>=0.4.1", "anthropic>=2.3"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["agent"]

[tool.setuptools.package-data]
agent = ["rules/*.elpi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
